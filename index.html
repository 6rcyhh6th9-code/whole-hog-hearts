function validPassFor(s,p,cards){if(!Array.isArray(cards)||cards.length!==3)return false;let ids=cards.map(id);if(new Set(ids).size!==3)return false;let owned=new Set((s.hands[p]||[]).map(id));return ids.every(x=>owned.has(x))}
async function completePass(s){s=normalizeState(s);let passes=s.passes||{};for(let p=0;p<4;p++)if(!validPassFor(s,p,passes[p]))return;let old=s.hands.map(h=>h.slice());for(let p=0;p<4;p++){let out=new Set(passes[p].map(id));s.hands[p]=old[p].filter(c=>!out.has(id(c)))}for(let p=0;p<4;p++)s.hands[(p+1)%4].push(...passes[p]);s.hands.forEach(sort);if(!s.hands.every(h=>h.length===13)){s.phase='over';s.roundMessage='Pass integrity error.';return db.ref('rooms/'+room).update({status:'over',state:s})}s.phase='play';s.turn=(s.dealer+1)%4;s.lead=null;s.trick=[];s.tricksCompleted=0;s.resolving=false;s.resolveAt=0;s.roundScored=false;s.turnStartedAt=Date.now();await db.ref('rooms/'+room+'/state').set(s)}
async function automation(g){if(!isHost||automationBusy||g.status!=='playing')return;automationBusy=true;try{let s=normalizeState(g.state),seats=g.seats||[];if(seats.length!==4)return;if(s.phase==='pass'){let passes=s.passes||{};for(let p=0;p<4;p++)if(seats[p].bot&&!validPassFor(s,p,passes[p])){let pick=s.hands[p].map((c,i)=>({c,i,v:danger(c)})).sort((a,b)=>b.v-a.v).slice(0,3).map(x=>x.i);await db.ref('rooms/'+room+'/state/passes/'+p).set(pick.map(i=>s.hands[p][i]));return}for(let p=0;p<4;p++)if(!seats[p].bot&&!validPassFor(s,p,passes[p])){let last=Number(s.passActivity?.[p]||s.passStartedAt||Date.now());if(Date.now()-last>=10000){let ix=shuffle(s.hands[p].map((_,i)=>i)).slice(0,3),cards=ix.map(i=>s.hands[p][i]);await db.ref('rooms/'+room+'/state/passes/'+p).set(cards);return}}if([0,1,2,3].every(p=>validPassFor(s,p,passes[p])))return completePass(s);return}if(s.phase==='resolving'){if(Date.now()>=Number(s.resolveAt||0))return resolveTrick();return}if(s.phase==='play'){if(s.resolving||s.trick.length>=4||!Number.isInteger(s.turn)||s.turn<0||s.turn>3)return;let seat=seats[s.turn];if(!seat)return;let elapsed=Date.now()-(s.turnStartedAt||Date.now());if((seat.bot&&elapsed>=700)||(!seat.bot&&elapsed>=10000)){let opts=legal(s.hands[s.turn],s.lead);if(!opts.length)return;let i=opts[Math.floor(Math.random()*opts.length)];return applyPlay(s.turn,i)}}}finally{automationBusy=false}}

window.addEventListener('error',e=>{try{$('status').textContent='Game error: '+e.message}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{$('status').textContent='Game error: '+(e.reason?.message||e.reason)}catch(_){}});
$('passBtn').onclick=commitPass;$('practiceBtn').onclick=()=>createRoom(true);$('createBtn').onclick=()=>createRoom(false);$('joinBtn').onclick=joinRoom;$('leaveBtn').onclick=leave;$('joinCode').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6));
setInterval(()=>{if(latest){if(latest.status==='waiting')sync(latest);else if(latest.status==='playing'){render(latest);if(isHost)automation(latest)}}},500);

db.ref('rooms').on('child_added',()=>{});
db.ref('rooms').on('child_removed',()=>{});
db.ref('rooms').off();
db.ref('rooms').on('value',()=>{}); db.ref('rooms').off();

setInterval(async()=>{if(!room||!isHost)return;let ref=db.ref('rooms/'+room+'/requests'),snap=await ref.once('value'),q=snap.val()||{};for(const [k,v] of Object.entries(q)){await ref.child(k).remove();if(v?.type==='play')await applyPlay(v.p,v.i)}},250);
